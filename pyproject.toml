[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dangbei-tank"
version = "0.1.0"
description = "Dangbei fish tank local gateway and Home Assistant integration source"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Crazykev"},
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "paho-mqtt>=2.1,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[project.scripts]
dangbei-tank-gateway = "dangbei_tank_gateway.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
